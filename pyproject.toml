[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-product-format"
version = "0.2.5"
description = "An additive OKF profile for product definition, UX, slices, and proof"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
opf-validate = "opf.validate:main"
